server.port=8080
spring.application.name=canada-day-calculator

# Actuator endpoints
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Application info
info.app.name=Canada Day Calculator Service
info.app.description=Microservice for calculating Canada Day day-of-week - Migrated from COBOL AS400 CANDAY01
info.app.version=1.0.0
info.migration.source=COBOL AS400
info.migration.program=CANDAY01.CBLLE

# Logging
logging.level.root=INFO
logging.level.com.contoso.holiday=DEBUG
