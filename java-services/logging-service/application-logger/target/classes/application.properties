server.port=8081
spring.application.name=application-logging-service

# Database configuration (H2 in-memory for demonstration)
spring.datasource.url=jdbc:h2:mem:loggingdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# H2 Console (for development/testing)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Actuator endpoints
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Application info
info.app.name=Application Logging Service
info.app.description=Centralized logging microservice - Migrated from COBOL AS400 LOG0010CB
info.app.version=1.0.0
info.migration.source=COBOL AS400
info.migration.program=LOG0010CB.cblle
info.migration.datafile=LOGP0.pf

# Logging
logging.level.root=INFO
logging.level.com.contoso.logging=DEBUG
logging.level.org.hibernate.SQL=DEBUG
