version: '3.8'

services:
  # Canada Day Calculator Service
  # Migrated from COBOL AS400 CANDAY01.CBLLE
  holiday-service:
    build:
      context: ./holiday-service/canadaday-calculator
      dockerfile: Dockerfile
    container_name: canada-day-calculator
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/v1/canada-day/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # Application Logging Service
  # Migrated from COBOL AS400 LOG0010CB.cblle
  logging-service:
    build:
      context: ./logging-service/application-logger
      dockerfile: Dockerfile
    container_name: application-logger
    ports:
      - "8081:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/api/v1/logs/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

networks:
  microservices-network:
    driver: bridge
